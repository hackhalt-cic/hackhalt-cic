<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0a" />
  <title>OSINT Framework - HackHalt Cyber Intelligence Council</title>
  <meta name="description" content="HackHalt OSINT Framework - A comprehensive collection of OSINT tools organized in an interactive tree structure for cybersecurity professionals." />
  <meta name="keywords" content="OSINT, framework, cybersecurity, intelligence, tools, HackHalt" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ===== CSS VARIABLES - GREEN TERMINAL OSINT THEME ===== */
    :root {
      --bg-primary: #0a0f0a;
      --bg-secondary: #0d1410;
      --bg-tertiary: #111a14;
      --bg-card: #0f1a12;
      --bg-hover: rgba(0, 255, 65, 0.06);
      --bg-active: rgba(0, 255, 65, 0.10);
      --green-primary: #00ff41;
      --green-dim: #00cc33;
      --green-bright: #33ff66;
      --green-muted: #1a6b2a;
      --green-glow: 0 0 10px rgba(0, 255, 65, 0.3);
      --green-glow-strong: 0 0 20px rgba(0, 255, 65, 0.4), 0 0 40px rgba(0, 255, 65, 0.1);
      --text-primary: #c8e6c9;
      --text-secondary: #81c784;
      --text-muted: #4a7a4f;
      --border-color: #1a3d1f;
      --border-glow: #0d2e12;
      --tag-t: #42a5f5;
      --tag-t-bg: rgba(66, 165, 245, 0.12);
      --tag-r: #ffa726;
      --tag-r-bg: rgba(255, 167, 38, 0.12);
      --tag-m: #ce93d8;
      --tag-m-bg: rgba(206, 147, 216, 0.12);
      --tag-d: #ef5350;
      --tag-d-bg: rgba(239, 83, 80, 0.12);
      --font-mono: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      --radius: 6px;
      --radius-lg: 10px;
      --transition: 0.2s ease;
      --header-height: 64px;
    }

    /* ===== RESET & BASE ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-mono);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Subtle scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--green-muted); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

    /* ===== HEADER ===== */
    .fw-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 15, 10, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 24px;
    }
    .fw-header-inner {
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .fw-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .fw-brand img {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .fw-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .fw-brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green-primary);
      letter-spacing: 2px;
      text-shadow: var(--green-glow);
    }
    .fw-brand-subtitle {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .fw-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      margin-left: auto;
    }
    .fw-title span {
      color: var(--green-primary);
      text-shadow: var(--green-glow);
    }
    .fw-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }
    .fw-back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color var(--transition);
      white-space: nowrap;
    }
    .fw-back-link:hover { color: var(--green-primary); }

    /* ===== TERMINAL SEARCH BAR ===== */
    .fw-search-bar {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
    }
    .fw-search-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .fw-terminal-prompt {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 260px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0;
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .fw-terminal-prompt:focus-within {
      border-color: var(--green-primary);
      box-shadow: var(--green-glow);
    }
    .fw-prompt-prefix {
      padding: 10px 0 10px 14px;
      color: var(--green-primary);
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      user-select: none;
      text-shadow: var(--green-glow);
    }
    .fw-search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 10px 14px 10px 8px;
      outline: none;
      caret-color: var(--green-primary);
    }
    .fw-search-input::placeholder {
      color: var(--text-muted);
    }
    .fw-action-btns {
      display: flex;
      gap: 8px;
    }
    .fw-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .fw-btn:hover {
      border-color: var(--green-primary);
      color: var(--green-primary);
      box-shadow: var(--green-glow);
      text-shadow: var(--green-glow);
    }
    .fw-btn:active {
      background: rgba(0, 255, 65, 0.08);
    }

    /* ===== LEGEND BAR ===== */
    .fw-legend-bar {
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 24px;
      overflow-x: auto;
    }
    .fw-legend-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.68rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .fw-legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fw-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .fw-legend-dot--category { background: #ffc107; box-shadow: 0 0 6px rgba(255, 193, 7, 0.4); }
    .fw-legend-dot--tool { background: var(--green-primary); box-shadow: 0 0 6px rgba(0, 255, 65, 0.4); }
    .fw-legend-tag {
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.62rem;
      letter-spacing: 0.3px;
    }
    .fw-legend-tag--t { color: var(--tag-t); background: var(--tag-t-bg); }
    .fw-legend-tag--d { color: var(--tag-d); background: var(--tag-d-bg); }
    .fw-legend-tag--r { color: var(--tag-r); background: var(--tag-r-bg); }
    .fw-legend-tag--m { color: var(--tag-m); background: var(--tag-m-bg); }

    /* ===== STATS BAR ===== */
    .fw-stats-bar {
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .fw-stats-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .fw-stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fw-stat-value {
      color: var(--green-primary);
      font-weight: 700;
      text-shadow: var(--green-glow);
    }
    .fw-stat-label {
      color: var(--text-muted);
    }
    .fw-search-status {
      margin-left: auto;
      color: var(--green-dim);
      display: none;
    }
    .fw-search-status.active {
      display: flex;
    }

    /* ===== MAIN CONTAINER ===== */
    .fw-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px 24px 60px;
    }

    /* ===== LOADING STATE ===== */
    .fw-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
    }
    .fw-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--green-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fw-loading-text {
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .fw-loading-text span {
      color: var(--green-primary);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ===== TREE / ACCORDION ===== */
    .fw-tree {
      list-style: none;
    }
    .fw-tree ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    /* Category (folder) item */
    .fw-category {
      margin-bottom: 2px;
    }
    .fw-category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background var(--transition);
      user-select: none;
      border: 1px solid transparent;
    }
    .fw-category-header:hover {
      background: var(--bg-hover);
      border-color: var(--border-color);
    }
    .fw-category-header.active {
      background: var(--bg-active);
      border-color: rgba(0, 255, 65, 0.15);
    }
    .fw-category-arrow {
      color: var(--text-muted);
      font-size: 0.7rem;
      width: 16px;
      text-align: center;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }
    .fw-category-header.active .fw-category-arrow {
      transform: rotate(90deg);
      color: var(--green-primary);
    }
    .fw-category-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }
    .fw-category-name {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
    }
    .fw-category-count {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--green-dim);
      background: rgba(0, 255, 65, 0.08);
      border: 1px solid rgba(0, 255, 65, 0.15);
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    /* Category children container */
    .fw-category-children {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      padding-left: 20px;
      border-left: 1px solid var(--border-color);
      margin-left: 21px;
    }
    .fw-category-children.open {
      max-height: 5000px;
    }

    /* Nested depth styling */
    .fw-category-children .fw-category-children {
      margin-left: 18px;
    }

    /* Tool (leaf) item */
    .fw-tool {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--radius);
      transition: background var(--transition);
      margin: 1px 0;
    }
    .fw-tool:hover {
      background: var(--bg-hover);
    }
    .fw-tool-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-primary);
      box-shadow: 0 0 6px rgba(0, 255, 65, 0.4);
      flex-shrink: 0;
    }
    .fw-tool-link {
      color: var(--green-dim);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 400;
      transition: color var(--transition), text-shadow var(--transition);
      word-break: break-word;
    }
    .fw-tool-link:hover {
      color: var(--green-primary);
      text-shadow: var(--green-glow);
    }
    .fw-tool-label {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }
    .fw-tool-external {
      font-size: 0.55rem;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity var(--transition);
      margin-left: 2px;
      flex-shrink: 0;
    }
    .fw-tool:hover .fw-tool-external {
      opacity: 1;
    }

    /* Tags */
    .fw-tag {
      font-size: 0.58rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .fw-tag-t { color: var(--tag-t); background: var(--tag-t-bg); }
    .fw-tag-r { color: var(--tag-r); background: var(--tag-r-bg); }
    .fw-tag-m { color: var(--tag-m); background: var(--tag-m-bg); }
    .fw-tag-d { color: var(--tag-d); background: var(--tag-d-bg); }

    /* Search hidden */
    .fw-search-hidden {
      display: none !important;
    }

    /* Search matched highlight */
    .fw-match mark {
      background: rgba(0, 255, 65, 0.2);
      color: var(--green-primary);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ===== FOOTER ===== */
    .fw-footer {
      border-top: 1px solid var(--border-color);
      padding: 20px 24px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .fw-footer a {
      color: var(--green-dim);
      text-decoration: none;
    }
    .fw-footer a:hover {
      color: var(--green-primary);
      text-shadow: var(--green-glow);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .fw-header-inner { gap: 12px; }
      .fw-brand-text { display: none; }
      .fw-title { font-size: 0.95rem; }
      .fw-search-inner { gap: 8px; }
      .fw-legend-inner { gap: 14px; font-size: 0.62rem; }
    }

    @media (max-width: 640px) {
      .fw-header { padding: 0 14px; height: 54px; }
      .fw-title { display: none; }
      .fw-brand-text { display: flex; }
      .fw-search-bar { padding: 10px 14px; }
      .fw-terminal-prompt { min-width: 0; }
      .fw-prompt-prefix { font-size: 0.72rem; padding-left: 10px; }
      .fw-search-input { font-size: 0.75rem; padding: 8px 10px 8px 6px; }
      .fw-action-btns { width: 100%; }
      .fw-btn { flex: 1; justify-content: center; padding: 7px 10px; font-size: 0.65rem; }
      .fw-legend-bar { padding: 6px 14px; }
      .fw-stats-bar { padding: 8px 14px; }
      .fw-container { padding: 10px 10px 40px; }
      .fw-category-header { padding: 8px 10px; gap: 8px; }
      .fw-category-name { font-size: 0.78rem; }
      .fw-category-children { padding-left: 14px; margin-left: 15px; }
      .fw-tool { padding: 6px 10px; }
      .fw-tool-link, .fw-tool-label { font-size: 0.74rem; }
    }

    @media (max-width: 400px) {
      .fw-btn .btn-text { display: none; }
      .fw-legend-inner { gap: 10px; }
      .fw-stats-inner { gap: 14px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="fw-header">
    <div class="fw-header-inner">
      <a href="https://hackhalt.org" class="fw-brand">
        <img src="images/logo.png" alt="HackHalt Logo" />
        <div class="fw-brand-text">
          <span class="fw-brand-title">HACKHALT</span>
          <span class="fw-brand-subtitle">Cyber Intelligence Council</span>
        </div>
      </a>
      <div class="fw-title"><span>&gt;_</span> OSINT Framework</div>
      <div class="fw-header-right">
        <a href="https://hackhalt.org" class="fw-back-link">
          <i class="fa-solid fa-arrow-left"></i> hackhalt.org
        </a>
      </div>
    </div>
  </header>

  <!-- Terminal Search Bar -->
  <div class="fw-search-bar">
    <div class="fw-search-inner">
      <div class="fw-terminal-prompt">
        <span class="fw-prompt-prefix">~/osint $</span>
        <input type="text" class="fw-search-input" id="fwSearch" placeholder="search tools..." autocomplete="off" spellcheck="false" />
      </div>
      <div class="fw-action-btns">
        <button class="fw-btn" id="btnExpandAll" title="Expand All">
          <i class="fa-solid fa-angles-down"></i>
          <span class="btn-text">Expand All</span>
        </button>
        <button class="fw-btn" id="btnCollapseAll" title="Collapse All">
          <i class="fa-solid fa-angles-up"></i>
          <span class="btn-text">Collapse All</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Legend Bar -->
  <div class="fw-legend-bar">
    <div class="fw-legend-inner">
      <div class="fw-legend-item">
        <span class="fw-legend-dot fw-legend-dot--category"></span>
        <span>Category</span>
      </div>
      <div class="fw-legend-item">
        <span class="fw-legend-dot fw-legend-dot--tool"></span>
        <span>Tool / Link</span>
      </div>
      <div class="fw-legend-item">
        <span class="fw-legend-tag fw-legend-tag--t">T</span>
        <span>CLI / Local Tool</span>
      </div>
      <div class="fw-legend-item">
        <span class="fw-legend-tag fw-legend-tag--d">D</span>
        <span>Google Dork</span>
      </div>
      <div class="fw-legend-item">
        <span class="fw-legend-tag fw-legend-tag--r">R</span>
        <span>Registration Required</span>
      </div>
      <div class="fw-legend-item">
        <span class="fw-legend-tag fw-legend-tag--m">M</span>
        <span>Manual URL Edit</span>
      </div>
    </div>
  </div>

  <!-- Stats Bar -->
  <div class="fw-stats-bar">
    <div class="fw-stats-inner">
      <div class="fw-stat">
        <span class="fw-stat-value" id="statCategories">--</span>
        <span class="fw-stat-label">categories</span>
      </div>
      <div class="fw-stat">
        <span class="fw-stat-value" id="statTools">--</span>
        <span class="fw-stat-label">tools</span>
      </div>
      <div class="fw-search-status" id="searchStatus">
        <span class="fw-stat-value" id="statMatches">0</span>
        <span class="fw-stat-label">&nbsp;matches found</span>
      </div>
    </div>
  </div>

  <!-- Tree Container -->
  <main class="fw-container">
    <div id="fwLoading" class="fw-loading">
      <div class="fw-loading-spinner"></div>
      <div class="fw-loading-text">Loading OSINT Framework<span>_</span></div>
    </div>
    <ul class="fw-tree" id="fwTree" style="display:none;"></ul>
  </main>

  <!-- Footer -->
  <footer class="fw-footer">
    <a href="https://hackhalt.org">&copy; HackHalt CIC</a> &mdash; OSINT Framework
  </footer>

  <!-- App Logic -->
  <script>
    (function() {
      'use strict';

      // ===== STATE =====
      let frameworkData = null;
      let totalTools = 0;
      let totalCategories = 0;

      // ===== COUNT ITEMS =====
      function countItems(node) {
        if (node.children && node.children.length > 0) {
          totalCategories++;
          node.children.forEach(countItems);
        } else if (node.url) {
          totalTools++;
        }
      }

      // Count tools in a specific node (for badges)
      function countToolsIn(node) {
        let count = 0;
        if (node.children) {
          node.children.forEach(child => {
            if (child.children && child.children.length > 0) {
              count += countToolsIn(child);
            } else if (child.url || child.name) {
              count++;
            }
          });
        }
        return count;
      }

      // ===== RENDER TAGS =====
      function renderTags(tags) {
        if (!tags || tags.length === 0) return '';
        return tags.map(t => {
          const key = t.toLowerCase();
          return `<span class="fw-tag fw-tag-${key}">${t}</span>`;
        }).join('');
      }

      // ===== RENDER NODE =====
      function renderNode(node, depth = 0) {
        const hasChildren = node.children && node.children.length > 0;

        if (hasChildren) {
          const toolCount = countToolsIn(node);
          const isTopLevel = depth === 0;
          let childrenHTML = '';
          node.children.forEach(child => {
            childrenHTML += renderNode(child, depth + 1);
          });

          return `
            <li class="fw-category" data-name="${escapeAttr(node.name.toLowerCase())}">
              <div class="fw-category-header" onclick="window.__fw.toggle(this)" role="button" tabindex="0">
                <span class="fw-category-arrow"><i class="fa-solid fa-chevron-right"></i></span>
                <span class="fw-category-icon">${isTopLevel ? '&#128193;' : '&#128194;'}</span>
                <span class="fw-category-name">${escapeHTML(node.name)}</span>
                ${renderTags(node.tags)}
                <span class="fw-category-count">${toolCount}</span>
              </div>
              <div class="fw-category-children">
                <ul>${childrenHTML}</ul>
              </div>
            </li>`;
        } else if (node.url) {
          return `
            <li class="fw-tool" data-name="${escapeAttr(node.name.toLowerCase())}">
              <span class="fw-tool-dot"></span>
              <a class="fw-tool-link" href="${escapeAttr(node.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(node.name)}</a>
              ${renderTags(node.tags)}
              <i class="fa-solid fa-arrow-up-right-from-square fw-tool-external"></i>
            </li>`;
        } else {
          return `
            <li class="fw-tool" data-name="${escapeAttr(node.name.toLowerCase())}">
              <span class="fw-tool-dot"></span>
              <span class="fw-tool-label">${escapeHTML(node.name)}</span>
              ${renderTags(node.tags)}
            </li>`;
        }
      }

      // ===== HELPERS =====
      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function escapeAttr(str) {
        return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // ===== TOGGLE CATEGORY =====
      function toggleCategory(header) {
        const isActive = header.classList.contains('active');
        header.classList.toggle('active');
        const children = header.nextElementSibling;
        if (children) {
          children.classList.toggle('open', !isActive);
        }
      }

      // ===== EXPAND / COLLAPSE ALL =====
      function expandAll() {
        document.querySelectorAll('.fw-category-header').forEach(h => {
          h.classList.add('active');
          const c = h.nextElementSibling;
          if (c) c.classList.add('open');
        });
      }

      function collapseAll() {
        document.querySelectorAll('.fw-category-header').forEach(h => {
          h.classList.remove('active');
          const c = h.nextElementSibling;
          if (c) c.classList.remove('open');
        });
      }

      // ===== SEARCH =====
      let searchTimeout;
      function handleSearch(query) {
        const tree = document.getElementById('fwTree');
        const status = document.getElementById('searchStatus');
        const matchCount = document.getElementById('statMatches');

        if (!query) {
          // Reset
          tree.querySelectorAll('.fw-search-hidden').forEach(el => el.classList.remove('fw-search-hidden'));
          status.classList.remove('active');
          collapseAll();
          return;
        }

        const lowerQ = query.toLowerCase();
        let matches = 0;

        // Process all tool items
        tree.querySelectorAll('.fw-tool').forEach(tool => {
          const name = tool.getAttribute('data-name') || '';
          if (name.includes(lowerQ)) {
            tool.classList.remove('fw-search-hidden');
            matches++;
          } else {
            tool.classList.add('fw-search-hidden');
          }
        });

        // Process categories: show if any child is visible
        const categories = Array.from(tree.querySelectorAll('.fw-category'));
        // Process from deepest to shallowest
        categories.reverse().forEach(cat => {
          const header = cat.querySelector(':scope > .fw-category-header');
          const childContainer = cat.querySelector(':scope > .fw-category-children');
          const catName = cat.getAttribute('data-name') || '';
          const nameMatch = catName.includes(lowerQ);

          if (nameMatch) {
            // Category name matches - show everything inside
            cat.classList.remove('fw-search-hidden');
            if (header) header.classList.add('active');
            if (childContainer) {
              childContainer.classList.add('open');
              childContainer.querySelectorAll('.fw-search-hidden').forEach(el => el.classList.remove('fw-search-hidden'));
            }
            return;
          }

          // Check if any visible children
          const hasVisibleChild = childContainer &&
            childContainer.querySelector('li:not(.fw-search-hidden)');

          if (hasVisibleChild) {
            cat.classList.remove('fw-search-hidden');
            if (header) header.classList.add('active');
            if (childContainer) childContainer.classList.add('open');
          } else {
            cat.classList.add('fw-search-hidden');
          }
        });

        matchCount.textContent = matches;
        status.classList.add('active');
      }

      // ===== KEYBOARD NAVIGATION =====
      function handleKeyboard(e) {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          document.getElementById('fwSearch').focus();
        }
        if (e.key === 'Escape') {
          const search = document.getElementById('fwSearch');
          if (document.activeElement === search) {
            search.value = '';
            handleSearch('');
            search.blur();
          }
        }
      }

      // ===== INIT =====
      async function init() {
        const tree = document.getElementById('fwTree');
        const loading = document.getElementById('fwLoading');

        try {
          // Fetch JSON data
          const response = await fetch('data/tools.json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          frameworkData = await response.json();

          // Count items
          totalTools = 0;
          totalCategories = 0;
          countItems(frameworkData);

          // Update stats
          document.getElementById('statCategories').textContent = totalCategories;
          document.getElementById('statTools').textContent = totalTools;

          // Render tree
          let html = '';
          frameworkData.children.forEach(child => {
            html += renderNode(child, 0);
          });
          tree.innerHTML = html;

          // Show tree
          loading.style.display = 'none';
          tree.style.display = '';

          // Bind search
          const searchInput = document.getElementById('fwSearch');
          searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => handleSearch(e.target.value.trim()), 150);
          });

          // Bind buttons
          document.getElementById('btnExpandAll').addEventListener('click', expandAll);
          document.getElementById('btnCollapseAll').addEventListener('click', collapseAll);

          // Keyboard shortcut
          document.addEventListener('keydown', handleKeyboard);

          // Category header keyboard support
          tree.querySelectorAll('.fw-category-header').forEach(h => {
            h.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleCategory(h);
              }
            });
          });

        } catch (err) {
          loading.innerHTML = `
            <div style="color: var(--tag-d); font-size: 0.85rem;">
              <i class="fa-solid fa-triangle-exclamation"></i>
              Error loading framework data
            </div>
            <div style="color: var(--text-muted); font-size: 0.75rem;">${escapeHTML(err.message)}</div>
          `;
        }
      }

      // Expose toggle to global scope for onclick
      window.__fw = { toggle: toggleCategory };

      // Start
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>

</body>
</html>
