  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
  <title>OSINT Framework - HackHalt Cyber Intelligence Council</title>
  <meta name="description" content="HackHalt OSINT Framework - A comprehensive collection of OSINT tools organized in an interactive tree structure for cybersecurity professionals." />
  <meta name="keywords" content="OSINT, framework, cybersecurity, intelligence, tools, HackHalt" />

  <style>
    :root {
      --fw-bg: #1a0a2e;
      --fw-bg-secondary: #16082b;
      --fw-text: #e2e8f0;
      --fw-text-muted: #94a3b8;
      --fw-accent: #00d9ff;
      --fw-accent-hover: #00b8d9;
      --fw-node-bg: transparent;
      --fw-node-hover: rgba(0, 217, 255, 0.08);
      --fw-line: #334155;
      --fw-tag-t: #f59e0b;
      --fw-tag-r: #ef4444;
      --fw-tag-m: #8b5cf6;
      --fw-tag-d: #22c55e;
      --fw-link: #00d9ff;
      --fw-header-bg: rgba(26, 10, 46, 0.95);
      --fw-search-bg: #0f172a;
      --fw-search-border: #334155;
      --fw-border-radius: 6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--fw-bg);
      color: var(--fw-text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .fw-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--fw-header-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 217, 255, 0.15);
      padding: 12px 24px;
    }
    .fw-header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .fw-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--fw-text);
    }
    .fw-brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }
    .fw-brand-text {
      display: flex;
      flex-direction: column;
    }
    .fw-brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--fw-accent);
      letter-spacing: 1px;
    }
    .fw-brand-subtitle {
      font-size: 0.7rem;
      color: var(--fw-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .fw-title {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      flex: 1;
      min-width: 200px;
    }
    .fw-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .fw-search-wrap {
      position: relative;
    }
    .fw-search {
      background: var(--fw-search-bg);
      border: 1px solid var(--fw-search-border);
      border-radius: 20px;
      padding: 8px 16px 8px 36px;
      color: var(--fw-text);
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: border-color 0.2s, width 0.3s;
    }
    .fw-search:focus {
      border-color: var(--fw-accent);
      width: 280px;
    }
    .fw-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fw-text-muted);
      font-size: 0.8rem;
    }
    .fw-btn {
      background: transparent;
      border: 1px solid var(--fw-line);
      color: var(--fw-text);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .fw-btn:hover {
      border-color: var(--fw-accent);
      color: var(--fw-accent);
    }
    .fw-back-link {
      color: var(--fw-text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .fw-back-link:hover { color: var(--fw-accent); }

    /* Legend */
    .fw-legend {
      position: fixed;
      top: 80px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--fw-line);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.78rem;
      z-index: 90;
      line-height: 1.8;
    }
    .fw-legend-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--fw-accent);
      font-size: 0.82rem;
    }
    .fw-legend span {
      margin-right: 4px;
      font-weight: 700;
    }

    /* Tree Container */
    .fw-container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 30px 24px 60px;
    }

    /* Tree Styles */
    .fw-tree {
      list-style: none;
      padding-left: 0;
    }
    .fw-tree ul {
      list-style: none;
      padding-left: 24px;
      margin: 0;
      position: relative;
    }
    .fw-tree ul::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 0;
      bottom: 10px;
      width: 1px;
      background: var(--fw-line);
    }
    .fw-tree li {
      position: relative;
      margin: 0;
      padding: 2px 0;
    }
    .fw-tree ul > li::before {
      content: '';
      position: absolute;
      left: -13px;
      top: 16px;
      width: 13px;
      height: 1px;
      background: var(--fw-line);
    }

    /* Node */
    .fw-node {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: var(--fw-border-radius);
      cursor: default;
      transition: background 0.15s;
      user-select: none;
      font-size: 0.88rem;
    }
    .fw-node:hover {
      background: var(--fw-node-hover);
    }
    .fw-node-toggle {
      cursor: pointer;
    }

    /* Node dot / icon */
    .fw-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--fw-accent);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .fw-node-toggle .fw-dot {
      background: #fff;
    }
    .fw-node-toggle[data-expanded="false"] .fw-dot {
      background: var(--fw-accent);
    }

    /* Collapse indicator */
    .fw-caret {
      font-size: 0.65rem;
      color: var(--fw-text-muted);
      transition: transform 0.2s;
      margin-right: 2px;
      flex-shrink: 0;
    }
    .fw-node-toggle[data-expanded="true"] .fw-caret {
      transform: rotate(90deg);
    }

    /* Node label */
    .fw-label {
      color: var(--fw-text);
    }
    .fw-node-toggle .fw-label {
      font-weight: 500;
    }

    /* External links */
    .fw-link {
      color: var(--fw-link);
      text-decoration: none;
      transition: color 0.15s;
    }
    .fw-link:hover {
      color: #fff;
      text-decoration: underline;
    }
    .fw-external-icon {
      font-size: 0.65rem;
      margin-left: 2px;
      opacity: 0.6;
    }

    /* Tags */
    .fw-tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .fw-tag-t { color: var(--fw-tag-t); }
    .fw-tag-r { color: var(--fw-tag-r); }
    .fw-tag-m { color: var(--fw-tag-m); }
    .fw-tag-d { color: var(--fw-tag-d); }

    /* Collapsed children */
    .fw-children-hidden {
      display: none;
    }

    /* Search highlight */
    .fw-highlight {
      background: rgba(0, 217, 255, 0.2);
      border-radius: 3px;
      padding: 0 2px;
    }
    .fw-search-hidden {
      display: none;
    }

    /* Stats bar */
    .fw-stats {
      text-align: center;
      padding: 12px;
      color: var(--fw-text-muted);
      font-size: 0.78rem;
      border-bottom: 1px solid rgba(0, 217, 255, 0.08);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .fw-legend { display: none; }
      .fw-title { font-size: 1.2rem; }
      .fw-search { width: 160px; }
      .fw-search:focus { width: 200px; }
      .fw-header-inner { gap: 8px; }
    }
    @media (max-width: 600px) {
      .fw-header { padding: 10px 12px; }
      .fw-container { padding: 16px 10px 40px; }
      .fw-title { font-size: 1rem; order: 3; flex-basis: 100%; }
      .fw-tree ul { padding-left: 16px; }
      .fw-node { font-size: 0.82rem; padding: 4px 8px; }
      .fw-search { width: 140px; }
      .fw-search:focus { width: 180px; }
      .fw-btn { padding: 6px 10px; font-size: 0.75rem; }
    }

    /* Smooth animations */
    .fw-tree li {
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-5px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--fw-bg); }
    ::-webkit-scrollbar-thumb { background: var(--fw-line); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fw-accent); }
  </style>
</head>

    // ---- Tree Renderer ----
    let totalTools = 0;
    let totalCategories = 0;

    function countItems(node) {
      if (node.children && node.children.length > 0) {
        totalCategories++;
        node.children.forEach(countItems);
      } else if (node.url) {
        totalTools++;
      }
    }

    function renderTags(tags) {
      if (!tags || tags.length === 0) return '';
      return tags.map(t => `<span class="fw-tag fw-tag-${t.toLowerCase()}">(${t})</span>`).join('');
    }

    function renderNode(node, depth = 0) {
      const hasChildren = node.children && node.children.length > 0;
      const isRoot = depth === 0 && !node.url;
      const expanded = depth < 1; // Only root level expanded by default

      let html = '<li>';

      if (hasChildren) {
        html += `<div class="fw-node fw-node-toggle" data-expanded="${expanded}" onclick="toggleNode(this)">`;
        html += `<i class="fa-solid fa-caret-right fw-caret"></i>`;
        html += `<span class="fw-dot"></span>`;
        html += `<span class="fw-label">${node.name}</span>`;
        html += renderTags(node.tags);
        html += `</div>`;
        html += `<ul class="${expanded ? '' : 'fw-children-hidden'}">`;
        node.children.forEach(child => {
          html += renderNode(child, depth + 1);
        });
        html += '</ul>';
      } else if (node.url) {
        html += `<div class="fw-node">`;
        html += `<span class="fw-dot"></span>`;
        html += `<a class="fw-link" href="${node.url}" target="_blank" rel="noopener noreferrer">${node.name}</a>`;
        html += renderTags(node.tags);
        html += `<i class="fa-solid fa-arrow-up-right-from-square fw-external-icon"></i>`;
        html += `</div>`;
      } else {
        html += `<div class="fw-node">`;
        html += `<span class="fw-dot"></span>`;
        html += `<span class="fw-label">${node.name}</span>`;
        html += renderTags(node.tags);
        html += `</div>`;
      }

      html += '</li>';
      return html;
    }

    function toggleNode(el) {
      const expanded = el.getAttribute('data-expanded') === 'true';
      el.setAttribute('data-expanded', !expanded);
      const childList = el.nextElementSibling;
      if (childList) {
        childList.classList.toggle('fw-children-hidden', expanded);
      }
    }

    function setAllNodes(expand) {
      document.querySelectorAll('.fw-node-toggle').forEach(el => {
        el.setAttribute('data-expanded', expand);
        const childList = el.nextElementSibling;
        if (childList) {
          childList.classList.toggle('fw-children-hidden', !expand);
        }
      });
    }

    // Search
    function searchTree(query) {
      const allNodes = document.querySelectorAll('.fw-tree li');
      if (!query) {
        allNodes.forEach(li => {
          li.classList.remove('fw-search-hidden');
          li.querySelectorAll('.fw-highlight').forEach(h => {
            h.outerHTML = h.textContent;
          });
        });
        return;
      }

      const lowerQ = query.toLowerCase();

      allNodes.forEach(li => {
        const nodeDiv = li.querySelector('.fw-node');
        if (!nodeDiv) return;
        const text = nodeDiv.textContent.toLowerCase();
        const match = text.includes(lowerQ);

        if (match) {
          li.classList.remove('fw-search-hidden');
          // Expand all parents
          let parent = li.parentElement;
          while (parent) {
            if (parent.classList.contains('fw-children-hidden')) {
              parent.classList.remove('fw-children-hidden');
              const toggle = parent.previousElementSibling;
              if (toggle && toggle.classList.contains('fw-node-toggle')) {
                toggle.setAttribute('data-expanded', 'true');
              }
            }
            parent = parent.parentElement;
          }
        } else {
          // Hide only if no children match
          const childLinks = li.querySelectorAll(':scope > ul li');
          const hasChildMatch = Array.from(childLinks).some(child => {
            const childNode = child.querySelector('.fw-node');
            return childNode && childNode.textContent.toLowerCase().includes(lowerQ);
          });
          if (!hasChildMatch) {
            li.classList.add('fw-search-hidden');
          } else {
            li.classList.remove('fw-search-hidden');
            // Expand
            const toggle = li.querySelector(':scope > .fw-node-toggle');
            if (toggle) {
              toggle.setAttribute('data-expanded', 'true');
              const ul = toggle.nextElementSibling;
              if (ul) ul.classList.remove('fw-children-hidden');
            }
          }
        }
      });
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      const tree = document.getElementById('fwTree');
      const stats = document.getElementById('fwStats');
      
      totalTools = 0;
      totalCategories = 0;
      countItems(FRAMEWORK_DATA);

      let treeHTML = '';
      FRAMEWORK_DATA.children.forEach(child => {
        treeHTML += renderNode(child, 0);
      });
      tree.innerHTML = treeHTML;

      stats.textContent = `${totalCategories} categories · ${totalTools} tools`;

      // Search
      const searchInput = document.getElementById('fwSearch');
      let searchTimeout;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchTree(e.target.value.trim()), 200);
      });

      // Expand / Collapse All
      document.getElementById('btnExpandAll').addEventListener('click', () => setAllNodes(true));
      document.getElementById('btnCollapseAll').addEventListener('click', () => setAllNodes(false));
    });
