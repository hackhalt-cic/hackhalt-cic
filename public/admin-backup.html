  <script defer>
    // API Base URL Configuration
    let apiBase = window.location.origin;
    if (window.location.hostname !== 'localhost' && !window.location.hostname.includes('vercel')) {
      apiBase = 'https://hackhalt-cic-lemon.vercel.app';
    }
    console.log('API Base:', apiBase);
    
    // Helper function to get full API URL
    function getApiUrl(endpoint) {
      if (endpoint.startsWith('http')) return endpoint;
      return apiBase + endpoint;
    }

    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();
    console.log('Admin page initialized');
    
    // Force show contact tab on page load
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM Content Loaded');
      const contactTab = document.getElementById('contact');
      const contactBtn = document.querySelector('[data-tab="contact"]');
      
      if (contactTab) {
        contactTab.classList.add('active');
        contactTab.style.display = 'block';
      }
      if (contactBtn) {
        contactBtn.classList.add('active');
      }
      
      // Hide all other tabs
      document.querySelectorAll('.tab-content').forEach(tab => {
        if (tab.id !== 'contact') {
          tab.style.display = 'none';
        }
      });
    });
    
    // Also run after slight delay to be safe
    setTimeout(function() {
      console.log('Timeout: forcing contact tab visible');
      const contactTab = document.getElementById('contact');
      if (contactTab && contactTab.style.display !== 'block') {
        contactTab.style.display = 'block';
        contactTab.classList.add('active');
      }
    }, 500);

    // Load submissions with fallback
    async function loadSubmissions() {
      try {
        console.log('Loading submissions from API...');
        
        // FIRST: Force all elements visible immediately
        forceShowDashboard();
        
        // Try main endpoint first
        let response = await fetch(getApiUrl('/api/submissions'), {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include'
        }).catch(e => {
          console.warn('Primary endpoint failed:', e);
          return null;
        });

        if (!response || !response.ok) {
          console.warn('Primary endpoint failed, trying individual endpoints...');
          
          // Try individual endpoints as fallback
          const endpoints = [
            { url: '/api/submissions/contact', key: 'contact' },
            { url: '/api/submissions/join', key: 'join' },
            { url: '/api/submissions/blogs', key: 'blogs' },
            { url: '/api/submissions/ambassadors', key: 'ambassadors' }
          ];
          
          const results = {};
          for (const ep of endpoints) {
            try {
              const res = await fetch(getApiUrl(ep.url), { credentials: 'include' });
              if (res.ok) {
                results[ep.key] = await res.json();
              } else {
                results[ep.key] = { submissions: [] };
              }
            } catch (e) {
              console.warn(`${ep.key} endpoint error:`, e);
              results[ep.key] = { submissions: [] };
            }
          }
          
          const data = {
            success: true,
            counts: {
              contact: (results.contact.submissions || []).length,
              join: (results.join.submissions || []).length,
              blogs: (results.blogs.submissions || []).length,
              ambassadors: (results.ambassadors.submissions || []).length
            },
            submissions: {
              contact: results.contact.submissions || [],
              join: results.join.submissions || [],
              blogs: results.blogs.submissions || [],
              ambassadors: results.ambassadors.submissions || []
            }
          };
          
          console.log('Loaded via fallback endpoints:', data);
          updateDashboard(data);
          return;
        }

        const data = await response.json();
        console.log('Submissions loaded successfully:', data);
        updateDashboard(data);
      } catch (error) {
        console.error('Critical error loading submissions:', error);
        forceShowDashboard();
        
        // Render with empty data
        try {
          document.getElementById('contactCount').textContent = '0';
          document.getElementById('joinCount').textContent = '0';
          document.getElementById('blogCount').textContent = '0';
          document.getElementById('ambassadorCount').textContent = '0';
          
          renderContactSubmissions([]);
          renderJoinSubmissions([]);
          renderBlogSubmissions([]);
          renderBlogFormResponses([]);
          renderAmbassadorSubmissions([]);
        } catch (e) {
          console.error('Error rendering empty state:', e);
        }
      }
    }
    
    // Force dashboard to show regardless of anything else
    function forceShowDashboard() {
      try {
        document.body.style.display = 'block';
        document.body.style.visibility = 'visible';
        document.body.style.opacity = '1';
        
        const section = document.querySelector('section.section');
        if (section) {
          section.style.display = 'block';
          section.style.visibility = 'visible';
          section.style.opacity = '1';
        }
        
        const container = document.querySelector('.admin-container');
        if (container) {
          container.style.display = 'block';
          container.style.visibility = 'visible';
          container.style.opacity = '1';
        }
        
        const stats = document.querySelector('.admin-stats');
        if (stats) {
          stats.style.display = 'grid';
          stats.style.visibility = 'visible';
          stats.style.opacity = '1';
        }
        
        const tabs = document.querySelector('.tabs-container');
        if (tabs) {
          tabs.style.display = 'flex';
          tabs.style.visibility = 'visible';
          tabs.style.opacity = '1';
        }
        
        const contact = document.getElementById('contact');
        if (contact) {
          contact.style.display = 'block';
          contact.style.visibility = 'visible';
          contact.style.opacity = '1';
          contact.classList.add('active');
        }
        
        const loading = document.getElementById('loadingIndicator');
        if (loading) {
          loading.style.display = 'none';
          loading.style.visibility = 'hidden';
        }
      } catch (e) {
        console.error('Error in forceShowDashboard:', e);
      }
    }

    function updateDashboard(data) {
      console.log('Updating dashboard with data:', data);
      
      // CRITICAL: Force all elements visible first
      forceShowDashboard();
      
      // Hide loading indicator
      const loadingIndicator = document.getElementById('loadingIndicator');
      if (loadingIndicator) {
        loadingIndicator.style.display = 'none';
        loadingIndicator.style.visibility = 'hidden';
        console.log('Loading indicator hidden');
      }
      
      // Ensure stats are visible
      const statsContainer = document.querySelector('.admin-stats');
      if (statsContainer) {
        statsContainer.style.display = 'grid';
        statsContainer.style.visibility = 'visible';
      }
      
      // Ensure tabs are visible
      const tabsContainer = document.querySelector('.tabs-container');
      if (tabsContainer) {
        tabsContainer.style.display = 'flex';
        tabsContainer.style.visibility = 'visible';
      }
      
      // Ensure at least contact tab is visible
      const contactTab = document.getElementById('contact');
      if (contactTab) {
        contactTab.style.display = 'block';
        contactTab.style.visibility = 'visible';
        contactTab.classList.add('active');
      }
      
      if (data.success || data.counts) {
        // Update stats
        const contactCount = document.getElementById('contactCount');
        const joinCount = document.getElementById('joinCount');
        const blogCount = document.getElementById('blogCount');
        const ambassadorCount = document.getElementById('ambassadorCount');
        
        if (contactCount) contactCount.textContent = data.counts?.contact || 0;
        if (joinCount) joinCount.textContent = data.counts?.join || 0;
        if (blogCount) blogCount.textContent = data.counts?.blogs || 0;
        if (ambassadorCount) ambassadorCount.textContent = data.counts?.ambassadors || 0;

        // Render submissions
        const submissions = data.submissions || {};
        renderContactSubmissions(submissions.contact || []);
        renderJoinSubmissions(submissions.join || []);
        if (submissions.blogs) {
          renderBlogSubmissions(submissions.blogs);
          renderBlogFormResponses(submissions.blogs);
        }
        if (submissions.ambassadors) {
          renderAmbassadorSubmissions(submissions.ambassadors);
        }
        
        console.log('Dashboard updated successfully');
      }
    }

    function renderContactSubmissions(submissions) {
      const tbody = document.getElementById('contactBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No contact messages yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${sub.name || 'Unknown'}</strong></td>
          <td><a href="mailto:${sub.email}">${sub.email || 'N/A'}</a></td>
          <td>${sub.phone || 'N/A'}</td>
          <td>${sub.subject || 'N/A'}</td>
          <td class="message-preview" title="${sub.message || ''}">${(sub.message || '').substring(0, 40)}...</td>
          <td class="timestamp">${new Date(sub.created_at || sub.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteContactSubmission(${sub.id || sub._id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderJoinSubmissions(submissions) {
      const tbody = document.getElementById('joinBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No join requests yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${sub.name || 'Unknown'}</strong></td>
          <td><a href="mailto:${sub.email}">${sub.email || 'N/A'}</a></td>
          <td>${sub.organization || 'N/A'}</td>
          <td>${sub.interests || 'N/A'}</td>
          <td class="timestamp">${new Date(sub.created_at || sub.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteJoinSubmission(${sub.id || sub._id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderBlogSubmissions(submissions) {
      const tbody = document.getElementById('blogsBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No blog submissions yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${sub.title || 'Untitled'}</strong></td>
          <td>${sub.author || 'Anonymous'}</td>
          <td><span class="badge">${sub.category || 'General'}</span></td>
          <td class="message-preview" title="${sub.content || ''}">${(sub.content || '').substring(0, 40)}...</td>
          <td class="timestamp">${new Date(sub.createdAt || sub.created_at).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteBlogSubmission('${sub._id || sub.id}')">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderBlogFormResponses(submissions) {
      const grid = document.getElementById('blogFormsGrid');
      if (!grid) return;
      
      if (!submissions || submissions.length === 0) {
        grid.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--text-secondary); grid-column: 1 / -1;">No form responses yet</div>';
        return;
      }

      grid.innerHTML = submissions.map((sub, idx) => `
        <div class="form-response-card">
          <div class="response-header">
            <h3>${sub.title || 'Untitled'}</h3>
            <span class="response-date">${new Date(sub.createdAt || sub.created_at).toLocaleDateString()}</span>
          </div>
          <div class="response-meta">
            <span class="meta-item"><strong>Author:</strong> ${sub.author || 'Anonymous'}</span>
            <span class="meta-item"><strong>Category:</strong> ${sub.category || 'General'}</span>
          </div>
          <div class="response-preview">
            ${(sub.content || 'No content').substring(0, 150)}...
          </div>
          <button class="view-btn" onclick="alert('Blog: ${(sub.content || '').replace(/'/g, "\\'").substring(0, 200)}')" style="margin-top: 1rem;">
            <i class="fa-solid fa-eye"></i> View Full
          </button>
        </div>
      `).join('');
    }

    function renderAmbassadorSubmissions(submissions) {
      const tbody = document.getElementById('ambassadorsBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No ambassador applications yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${(sub.firstName || '') + ' ' + (sub.lastName || '')}</strong></td>
          <td><a href="mailto:${sub.email}">${sub.email || 'N/A'}</a></td>
          <td>${sub.phone || 'N/A'}</td>
          <td>${sub.region || 'N/A'}</td>
          <td class="message-preview" title="${sub.expertise || ''}">${(sub.expertise || '').substring(0, 40)}...</td>
          <td class="timestamp">${new Date(sub.timestamp || sub.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteAmbassadorSubmission(${sub.id || sub._id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteContactSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(getApiUrl(`/api/submissions/contact/${id}`), { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    async function deleteJoinSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(getApiUrl(`/api/submissions/join/${id}`), { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    async function deleteBlogSubmission(id) {
      if (!confirm('Are you sure you want to delete this blog submission?')) return;
      try {
        const response = await fetch(getApiUrl(`/api/submissions/blogs/${id}`), { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    async function deleteAmbassadorSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(getApiUrl(`/api/ambassadors/${id}`), { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const targetSection = document.getElementById(tab);
        if (targetSection) {
          targetSection.classList.add('active');
        }
      });
    });

    // Refresh button
    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', loadSubmissions);
    }

    // Ensure dashboard shows immediately
    function ensureDashboardVisible() {
      console.log('ensureDashboardVisible called');
      
      try {
        // Show admin-container
        const container = document.querySelector('.admin-container');
        if (container) {
          container.style.display = 'block';
          container.style.visibility = 'visible';
          container.style.opacity = '1';
        }
        
        // Show stats
        const stats = document.querySelector('.admin-stats');
        if (stats) {
          stats.style.display = 'grid';
          stats.style.visibility = 'visible';
          stats.style.opacity = '1';
        }
        
        // Show tabs
        const tabs = document.querySelector('.tabs-container');
        if (tabs) {
          tabs.style.display = 'flex';
          tabs.style.visibility = 'visible';
          tabs.style.opacity = '1';
        }
        
        // Show contact tab
        const contactTab = document.getElementById('contact');
        if (contactTab) {
          contactTab.style.display = 'block';
          contactTab.style.visibility = 'visible';
          contactTab.style.opacity = '1';
          contactTab.classList.add('active');
        }
        
        // Hide loading indicator
        const loading = document.getElementById('loadingIndicator');
        if (loading) {
          loading.style.display = 'none';
          loading.style.visibility = 'hidden';
          loading.style.opacity = '0';
        }
        
        console.log('Dashboard visibility ensured');
      } catch (e) {
        console.error('Error in ensureDashboardVisible:', e);
      }
    }

    // Call ensureDashboardVisible IMMEDIATELY, not just on DOMContentLoaded
    ensureDashboardVisible();
    
    // Also call on DOMContentLoaded as backup
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ensureDashboardVisible);
    }

    // Load submissions data
    console.log('Page loaded - loading submissions...');
    loadSubmissions();
    
    // Force visibility again after 100ms, 300ms, and 500ms to ensure content appears
    setTimeout(forceShowDashboard, 100);
    setTimeout(forceShowDashboard, 300);
    setTimeout(ensureDashboardVisible, 500);

    // Auto-refresh every 30 seconds
    setInterval(loadSubmissions, 30000);
  </script>
</body>
</html>
