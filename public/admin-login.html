<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - HackHalt CIC</title>

  <meta name="description" content="Admin login for HackHalt CIC blog management." />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

  <!-- Google Font with optimized loading -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Font Awesome Icons - LOCAL FONTS FOR PRODUCTION RELIABILITY -->
  <link rel="preload" href="assets/fonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/fa-brands-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin />
  
  <style>
    @font-face {
      font-family: 'Font Awesome 6 Free';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url('assets/fonts/fa-regular-400.woff2') format('woff2'), url('assets/fonts/fa-regular-400.woff') format('woff');
    }
    @font-face {
      font-family: 'Font Awesome 6 Free';
      font-style: normal;
      font-weight: 900;
      font-display: block;
      src: url('assets/fonts/fa-solid-900.woff2') format('woff2'), url('assets/fonts/fa-solid-900.woff') format('woff');
    }
    @font-face {
      font-family: 'Font Awesome 6 Brands';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url('assets/fonts/fa-brands-400.woff2') format('woff2'), url('assets/fonts/fa-brands-400.woff') format('woff');
    }
    /* Font Awesome 6 Icon Rendering - Fixed Size 22px */
    [class*="fa-"] {
      display: inline-block !important;
      font-family: 'Font Awesome 6 Free', 'Font Awesome 6 Brands' !important;
      font-style: normal !important;
      font-variant: normal !important;
      text-rendering: auto !important;
      line-height: 1 !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      width: auto !important;
      height: auto !important;
      min-width: 0 !important;
      min-height: 0 !important;
      font-size: 22px !important;
      opacity: 1 !important;
      visibility: visible !important;
      color: inherit !important;
      vertical-align: -0.125em;
    }
    .fa, .fas, .fa-solid { font-family: 'Font Awesome 6 Free' !important; font-weight: 900 !important; }
    .fab, .fa-brands { font-family: 'Font Awesome 6 Brands' !important; font-weight: 400 !important; }
    i[class*="fa-"] {
      font-size: 22px !important;
      font-weight: 900 !important;
      display: inline-block !important;
      opacity: 1 !important;
      visibility: visible !important;
    }
  </style>

  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      padding: 1rem;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      background: var(--primary-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
    }

    .login-header h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .login-header p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--input-bg);
      color: var(--text-primary);
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      display: none;
      animation: slideDown 0.3s ease-out;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.15);
      gap: 0.75rem;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .error-message.show {
      display: flex !important;
      align-items: center;
    }

    .error-message i {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-right: 0.75rem;
    }

    .success-message {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      border-left: 4px solid #22c55e;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      display: none;
      animation: slideDown 0.3s ease-out;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
      gap: 0.75rem;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .success-message.show {
      display: flex !important;
      align-items: center;
    }

    .success-message i {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-right: 0.75rem;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading {
      display: inline-block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    [data-theme="dark"] {
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
    }

    [data-theme="light"] {
      --card-bg: #ffffff;
      --input-bg: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --primary-color: #3b82f6;
      --primary-dark: #2563eb;
    }

    /* Tablet Responsiveness */
    @media (max-width: 768px) {
      .login-container {
        padding: 1.5rem;
        min-height: 100vh;
      }

      .login-card {
        max-width: 100%;
        padding: 1.5rem;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .login-header p {
        font-size: 0.85rem;
      }

      .form-group label {
        font-size: 0.85rem;
      }

      .form-group input {
        padding: 0.65rem;
        font-size: 0.95rem;
      }

      .login-btn {
        padding: 0.65rem;
        font-size: 0.95rem;
      }
    }

    /* Mobile Responsiveness */
    @media (max-width: 480px) {
      .login-container {
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      }

      .login-card {
        max-width: 100%;
        padding: 1.25rem;
        border-radius: 8px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .login-logo {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
        margin: 0 auto 0.75rem;
      }

      .login-header h1 {
        font-size: 1.3rem;
        margin-bottom: 0.25rem;
      }

      .login-header p {
        font-size: 0.8rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      .form-group label {
        font-size: 0.8rem;
        margin-bottom: 0.4rem;
      }

      .form-group input {
        padding: 0.6rem;
        font-size: 0.9rem;
        border-radius: 4px;
      }

      .login-btn {
        padding: 0.6rem;
        font-size: 0.9rem;
        border-radius: 4px;
      }

      .error-message,
      .success-message {
        font-size: 0.8rem;
        padding: 0.75rem;
        margin-bottom: 1rem;
      }

      .error-message i,
      .success-message i {
        font-size: 1rem;
      }

      .login-card > div:last-child {
        font-size: 0.75rem;
        margin-top: 1rem;
      }
    }

  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1>Admin Login</h1>
        <p>Secure access for blog management</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">
            <i class="fa-solid fa-user"></i> Username
          </label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fa-solid fa-key"></i> Password
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span>Sign In</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.85rem;">
        <p>Authorized personnel only</p>
      </div>
    </div>
  </div>

  <script src="assets/js/api-config.js"></script>
  <script src="assets/js/utils.js"></script>
  
  <script>
    // Robust fallback if api-config.js fails to load
    if (typeof BACKEND_API_URL === 'undefined') {
      const _hostname = window.location.hostname;
      var BACKEND_API_URL = (_hostname === 'localhost' || _hostname === '127.0.0.1') 
        ? 'http://localhost:5000' 
        : 'https://hackhalt-cic-lemon.vercel.app';
      console.warn('[LOGIN] api-config.js not loaded, using fallback BACKEND_API_URL:', BACKEND_API_URL);
    }
    if (typeof getApiUrl !== 'function') {
      console.warn('[LOGIN] getApiUrl not available, defining fallback');
      function getApiUrl(endpoint) {
        if (!endpoint.startsWith('/')) endpoint = '/' + endpoint;
        const separator = endpoint.includes('?') ? '&' : '?';
        return BACKEND_API_URL + endpoint + separator + '_t=' + Date.now();
      }
    }
    
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    
    // Track request state
    let requestInProgress = false;
    let timeoutId = null;

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Prevent multiple submissions
      if (requestInProgress) {
        console.warn('[LOGIN] Request already in progress, ignoring duplicate submit');
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      // Clear messages
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');

      // Validate
      if (!username || !password) {
        errorMessage.innerHTML = '<i class="fa-solid fa-exclamation-circle"></i><span>Please enter both username and password</span>';
        errorMessage.classList.add('show');
        return;
      }

      // Mark request in progress
      requestInProgress = true;

      // Disable button and show loading state
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<div class="loading"><div class="spinner"></div></div> Signing in...';

      try {
        // Backend API URL from config
        const apiUrl = getApiUrl('/api/auth/login');
        
        console.log('[LOGIN] Sending login request to:', apiUrl);
        console.log('[LOGIN] Frontend domain:', window.location.origin);
        console.log('[LOGIN] Backend API:', BACKEND_API_URL);
        console.log('[LOGIN] Username:', username);
        
        const requestBody = JSON.stringify({ username, password });
        console.log('[LOGIN] Request payload size:', requestBody.length, 'bytes');
        
        // Create abort controller with 30 second timeout
        const controller = new AbortController();
        timeoutId = setTimeout(() => {
          console.error('[LOGIN] Request timeout - aborting after 30 seconds');
          controller.abort();
        }, 30000); // 30 second timeout
        
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          credentials: 'include',
          body: requestBody,
          signal: controller.signal
        });

        console.log('[LOGIN] Response received');
        console.log('[LOGIN] Response status:', response.status);
        console.log('[LOGIN] Response content-type:', response.headers.get('content-type'));
        console.log('[LOGIN] Response headers:', Array.from(response.headers.entries()).map(([k, v]) => `${k}: ${v}`).join(', '));

        // Clear timeout since response received
        if (timeoutId) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }

        // Get raw response to handle both JSON and HTML errors
        const responseText = await response.text();
        console.log('[LOGIN] Raw response length:', responseText.length);
        console.log('[LOGIN] Response first 500 chars:', responseText.substring(0, 500));

        // Check if response is HTML (error case)
        if (responseText.trim().startsWith('<')) {
          console.error('[LOGIN] API returned HTML instead of JSON');
          console.error('[LOGIN] Full HTML response:', responseText.substring(0, 1000));
          throw new Error('API returned HTML. Backend unreachable or misconfigured. Check that backend URL is correct.');
        }

        // Safe JSON parsing
        let data;
        try {
          if (!responseText) {
            throw new Error('Empty response from server');
          }
          data = JSON.parse(responseText);
          console.log('[LOGIN] Parsed JSON response:', data);
        } catch (parseError) {
          console.error('[LOGIN] Failed to parse JSON response');
          console.error('[LOGIN] Response content:', responseText.substring(0, 200));
          console.error('[LOGIN] Parse error:', parseError.message);
          throw new Error(`Server returned invalid JSON: ${parseError.message}`);
        }

        // Check response status
        if (!response.ok || (data && !data.success)) {
          const errorMsg = data?.error || data?.message || `HTTP ${response.status}`;
          console.warn('[LOGIN] Authentication failed:', errorMsg);
          throw new Error(errorMsg);
        }

        // Verify admin data
        if (!data || !data.admin) {
          console.error('[LOGIN] Missing admin data in response:', data);
          throw new Error('Invalid server response - missing admin data');
        }

        // Success - Store the access token for use in admin panel
        if (data.accessToken) {
          try {
            // Use localStorage which persists across sessions
            localStorage.setItem('adminToken', data.accessToken);
            console.log('[LOGIN] ✅ Token stored in localStorage for cross-domain API calls');
          } catch (e) {
            console.warn('[LOGIN] Could not store token in localStorage:', e.message);
          }
        }
        
        console.log('[LOGIN] Login successful for user:', data.admin.username);
        successMessage.innerHTML = '<i class="fa-solid fa-check-circle"></i><span>Login successful! Redirecting to dashboard...</span>';
        successMessage.classList.add('show');

        // Redirect after showing success message
        setTimeout(() => {
          window.location.href = '/admin';
        }, 1500);

      } catch (error) {
        console.error('[LOGIN] Error during login process:', error);
        
        // Clear timeout if still set
        if (timeoutId) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
        
        let errorMsg = 'Login failed. Please try again.';
        
        if (error.name === 'AbortError') {
          errorMsg = 'Request timeout (30s). Backend not responding. Check your Vercel deployment.';
        } else if (error.message.includes('HTML')) {
          errorMsg = 'Backend not responding with JSON. Verify your Vercel backend URL in api-config.js.';
        } else {
          errorMsg = error.message || errorMsg;
        }
        
        console.error('[LOGIN] Final error message:', errorMsg);
        errorMessage.innerHTML = `<i class="fa-solid fa-exclamation-circle"></i><span>${errorMsg}</span>`;
        errorMessage.classList.add('show');

      } finally {
        // CRITICAL: Always clear loading state in all cases
        requestInProgress = false;
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Sign In</span>';
        console.log('[LOGIN] Form reset - ready for next attempt');
      }
    });

    // Auto-focus on page load
    document.addEventListener('DOMContentLoaded', () => {
      const usernameField = document.getElementById('username');
      if (usernameField) {
        usernameField.focus();
      }
    });
  </script>
</body>
</html>
