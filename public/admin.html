<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - HackHalt CIC</title>

  <meta name="description" content="Admin dashboard to view and manage form submissions." />

  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

  <!-- Google Font with optimized loading -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />

  <!-- Font Awesome Icons (async loading) -->
  <link
    rel="preload"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </noscript>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/admin-styles.css" />
  <style>
    /* Ensure admin styles are applied */
    .admin-header h1 {
      font-size: 1.8rem;
      margin: 0;
    }
    
    .stat-card {
      min-height: 120px;
    }

    /* Hard Responsive Fixes */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      display: block;
    }

    .submissions-table {
      width: 100%;
      min-width: 500px;
    }

    @media (max-width: 768px) {
      .table-wrapper {
        margin: -2rem -1rem 0;
        padding: 0;
        border-radius: 0;
      }

      .submissions-table {
        min-width: 600px;
      }

      .tab-content {
        padding: 1rem 0.5rem;
      }
    }

    @media (max-width: 480px) {
      .table-wrapper {
        margin: -1rem -0.75rem 0;
      }

      .submissions-table {
        min-width: 700px;
        font-size: 0.75rem;
      }

      .submissions-table th,
      .submissions-table td {
        padding: 0.5rem 0.25rem;
      }

      .message-preview {
        max-width: 60px;
      }

      .delete-btn {
        padding: 0.35rem 0.5rem;
        font-size: 0.65rem;
        width: 100%;
      }

      .delete-btn i {
        display: none;
      }

      .forms-grid {
        grid-template-columns: 1fr;
      }

      .form-response-card {
        padding: 0.75rem;
      }

      .response-header {
        flex-direction: column;
        gap: 0.5rem;
      }

      .response-date {
        align-self: flex-start;
        font-size: 0.65rem;
      }

      .response-preview {
        font-size: 0.8rem;
        max-height: 80px;
      }
    }

</head>
<body>
  <!-- ========== HEADER / NAV ========== -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/" class="logo-wrapper" aria-label="HackHalt CIC Home">
        <img src="images/logo.png" alt="HackHalt CIC Logo" class="logo" />
        <div class="logo-text">
          <span class="logo-title">HackHalt</span>
          <span class="logo-subtitle">Admin Dashboard</span>
        </div>
      </a>

      <nav class="nav">
        <ul class="nav-links nav-primary" id="navLinks">
          <li><a href="/">Home</a></li>
          <li>
            <a href="/" class="btn btn-nav-cta">Exit Admin</a>
          </li>
        </ul>

        <!-- Theme Toggle -->
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle theme"
        >
          <i class="fa-solid fa-sun"></i>
        </button>
      </nav>
    </div>
  </header>

  <!-- ========== ADMIN SECTION ========== -->
  <section class="section">
    <div class="admin-container">
      <div class="admin-header">
        <h1>📊 Admin Dashboard</h1>
        <button class="refresh-btn" id="refreshBtn">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
      </div>

      <!-- Stats Cards -->
      <div class="admin-stats">
        <div class="stat-card">
          <div class="stat-number" id="contactCount">0</div>
          <div class="stat-label">Contact Messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="joinCount">0</div>
          <div class="stat-label">Join Requests</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="blogCount">0</div>
          <div class="stat-label">Blog Submissions</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="ambassadorCount">0</div>
          <div class="stat-label">Ambassador Applications</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="contact">
          <i class="fa-solid fa-envelope"></i> Contact Messages
        </button>
        <button class="tab-btn" data-tab="join">
          <i class="fa-solid fa-handshake"></i> Join Requests
        </button>
        <button class="tab-btn" data-tab="blogs">
          <i class="fa-solid fa-file-pen"></i> Blog Submissions
        </button>
        <button class="tab-btn" data-tab="ambassadors">
          <i class="fa-solid fa-users"></i> Ambassador Applications
        </button>
      </div>

      <!-- Contact Tab -->
      <div id="contact" class="tab-content active">
        <table class="submissions-table" id="contactTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Subject</th>
              <th>Message</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="contactBody">
            <tr>
              <td colspan="7" style="text-align: center; padding: 2rem;">
                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 0.5rem;"></i> Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Join Tab -->
      <div id="join" class="tab-content">
        <table class="submissions-table" id="joinTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Organization</th>
              <th>Interests</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="joinBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">
                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 0.5rem;"></i> Loading...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Blogs Tab -->
      <div id="blogs" class="tab-content">
        <div class="blogs-section">
          <div class="blogs-header">
            <h2><i class="fa-solid fa-book"></i> Blog Submissions</h2>
          </div>
          <table class="submissions-table" id="blogsTable">
            <thead>
              <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Content Preview</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="blogsBody">
              <tr>
                <td colspan="6" style="text-align: center; padding: 2rem;">
                  <i class="fa-solid fa-spinner fa-spin" style="margin-right: 0.5rem;"></i> Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Blog Form Responses Section -->
        <div class="blogs-forms-section">
          <div class="blogs-header">
            <h2><i class="fa-solid fa-comments"></i> Blog Form Responses</h2>
          </div>
          <div class="forms-grid" id="blogFormsGrid">
            <div style="text-align: center; padding: 2rem; grid-column: 1 / -1;">
              <i class="fa-solid fa-spinner fa-spin" style="margin-right: 0.5rem;"></i> Loading...
            </div>
          </div>
        </div>
      </div>

      <!-- Ambassadors Tab -->
      <div id="ambassadors" class="tab-content">
        <div class="table-wrapper">
          <table class="submissions-table" id="ambassadorsTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Region</th>
                <th>Expertise</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ambassadorsBody">
              <tr>
                <td colspan="7" style="text-align: center; padding: 2rem;">
                  <i class="fa-solid fa-spinner fa-spin" style="margin-right: 0.5rem;"></i> Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <div class="footer-bottom">
      <span>© <span id="year"></span> HackHalt - Cyber Intelligence Council. All rights reserved.</span>
    </div>
  </footer>

  <script src="assets/js/utils.js" defer></script>
  <script defer>
    // Set current year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Load submissions with fallback
    async function loadSubmissions() {
      try {
        // Try main endpoint first
        let response = await fetch('/api/submissions').catch(e => {
          console.warn('Primary endpoint failed, trying fallback...');
          return null;
        });

        if (!response) {
          // Try individual endpoints
          const [contact, join, blogs, ambassadors] = await Promise.all([
            fetch('/api/submissions/contact').then(r => r.json()).catch(e => ({ submissions: [] })),
            fetch('/api/submissions/join').then(r => r.json()).catch(e => ({ submissions: [] })),
            fetch('/api/submissions/blogs').then(r => r.json()).catch(e => ({ submissions: [] })),
            fetch('/api/submissions/ambassadors').then(r => r.json()).catch(e => ({ submissions: [] }))
          ]);

          const data = {
            success: true,
            counts: {
              contact: (contact.submissions || []).length,
              join: (join.submissions || []).length,
              blogs: (blogs.submissions || []).length,
              ambassadors: (ambassadors.submissions || []).length
            },
            submissions: {
              contact: contact.submissions || [],
              join: join.submissions || [],
              blogs: blogs.submissions || [],
              ambassadors: ambassadors.submissions || []
            }
          };
          
          updateDashboard(data);
          return;
        }

        const data = await response.json();
        updateDashboard(data);
      } catch (error) {
        console.error('Error loading submissions:', error);
        // Set default values
        document.getElementById('contactCount').textContent = '0';
        document.getElementById('joinCount').textContent = '0';
        document.getElementById('blogCount').textContent = '0';
        document.getElementById('ambassadorCount').textContent = '0';
      }
    }

    function updateDashboard(data) {
      if (data.success || data.counts) {
        // Update stats
        document.getElementById('contactCount').textContent = data.counts?.contact || 0;
        document.getElementById('joinCount').textContent = data.counts?.join || 0;
        document.getElementById('blogCount').textContent = data.counts?.blogs || 0;
        document.getElementById('ambassadorCount').textContent = data.counts?.ambassadors || 0;

        // Render submissions
        const submissions = data.submissions || {};
        renderContactSubmissions(submissions.contact || []);
        renderJoinSubmissions(submissions.join || []);
        if (submissions.blogs) {
          renderBlogSubmissions(submissions.blogs);
          renderBlogFormResponses(submissions.blogs);
        }
        if (submissions.ambassadors) {
          renderAmbassadorSubmissions(submissions.ambassadors);
        }
      }
    }

    function renderContactSubmissions(submissions) {
      const tbody = document.getElementById('contactBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No contact messages yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${sub.name || 'Unknown'}</strong></td>
          <td><a href="mailto:${sub.email}">${sub.email || 'N/A'}</a></td>
          <td>${sub.phone || 'N/A'}</td>
          <td>${sub.subject || 'N/A'}</td>
          <td class="message-preview" title="${sub.message || ''}">${(sub.message || '').substring(0, 40)}...</td>
          <td class="timestamp">${new Date(sub.created_at || sub.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteContactSubmission(${sub.id || sub._id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderJoinSubmissions(submissions) {
      const tbody = document.getElementById('joinBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No join requests yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${sub.name || 'Unknown'}</strong></td>
          <td><a href="mailto:${sub.email}">${sub.email || 'N/A'}</a></td>
          <td>${sub.organization || 'N/A'}</td>
          <td>${sub.interests || 'N/A'}</td>
          <td class="timestamp">${new Date(sub.created_at || sub.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteJoinSubmission(${sub.id || sub._id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderBlogSubmissions(submissions) {
      const tbody = document.getElementById('blogsBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No blog submissions yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${sub.title || 'Untitled'}</strong></td>
          <td>${sub.author || 'Anonymous'}</td>
          <td><span class="badge">${sub.category || 'General'}</span></td>
          <td class="message-preview" title="${sub.content || ''}">${(sub.content || '').substring(0, 40)}...</td>
          <td class="timestamp">${new Date(sub.createdAt || sub.created_at).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteBlogSubmission('${sub._id || sub.id}')">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    function renderBlogFormResponses(submissions) {
      const grid = document.getElementById('blogFormsGrid');
      if (!grid) return;
      
      if (!submissions || submissions.length === 0) {
        grid.innerHTML = '<div style="text-align: center; padding: 2rem; color: var(--text-secondary); grid-column: 1 / -1;">No form responses yet</div>';
        return;
      }

      grid.innerHTML = submissions.map((sub, idx) => `
        <div class="form-response-card">
          <div class="response-header">
            <h3>${sub.title || 'Untitled'}</h3>
            <span class="response-date">${new Date(sub.createdAt || sub.created_at).toLocaleDateString()}</span>
          </div>
          <div class="response-meta">
            <span class="meta-item"><strong>Author:</strong> ${sub.author || 'Anonymous'}</span>
            <span class="meta-item"><strong>Category:</strong> ${sub.category || 'General'}</span>
          </div>
          <div class="response-preview">
            ${(sub.content || 'No content').substring(0, 150)}...
          </div>
          <button class="view-btn" onclick="alert('Blog: ${(sub.content || '').replace(/'/g, "\\'").substring(0, 200)}')" style="margin-top: 1rem;">
            <i class="fa-solid fa-eye"></i> View Full
          </button>
        </div>
      `).join('');
    }

    function renderAmbassadorSubmissions(submissions) {
      const tbody = document.getElementById('ambassadorsBody');
      if (!tbody) return;
      
      if (!submissions || submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">No ambassador applications yet</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(sub => `
        <tr>
          <td><strong>${(sub.firstName || '') + ' ' + (sub.lastName || '')}</strong></td>
          <td><a href="mailto:${sub.email}">${sub.email || 'N/A'}</a></td>
          <td>${sub.phone || 'N/A'}</td>
          <td>${sub.region || 'N/A'}</td>
          <td class="message-preview" title="${sub.expertise || ''}">${(sub.expertise || '').substring(0, 40)}...</td>
          <td class="timestamp">${new Date(sub.timestamp || sub.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="delete-btn" onclick="deleteAmbassadorSubmission(${sub.id || sub._id})">
              <i class="fa-solid fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function deleteContactSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(`/api/submissions/contact/${id}`, { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    async function deleteJoinSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(`/api/submissions/join/${id}`, { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    async function deleteBlogSubmission(id) {
      if (!confirm('Are you sure you want to delete this blog submission?')) return;
      try {
        const response = await fetch(`/api/submissions/blogs/${id}`, { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    async function deleteAmbassadorSubmission(id) {
      if (!confirm('Are you sure you want to delete this submission?')) return;
      try {
        const response = await fetch(`/api/ambassadors/${id}`, { method: 'DELETE' });
        if (response.ok) loadSubmissions();
      } catch (error) {
        console.error('Error deleting submission:', error);
      }
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const targetSection = document.getElementById(tab);
        if (targetSection) {
          targetSection.classList.add('active');
        }
      });
    });

    // Refresh button
    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', loadSubmissions);
    }

    // Load on page load
    console.log('Page loaded - loading submissions...');
    loadSubmissions();

    // Auto-refresh every 30 seconds
    setInterval(loadSubmissions, 30000);
  </script>
</body>
</html>
